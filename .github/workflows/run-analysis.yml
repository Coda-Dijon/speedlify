name: Speedlify — scan & publish

on:
  schedule:
    - cron: "0 12 */3 * *"  # tous les 3 jours
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install npm dependencies
        run: npm install

      - name: Install deps (download Chromium)
        env:
          PUPPETEER_SKIP_DOWNLOAD: "false"
          PUPPETEER_PRODUCT: "chrome"
          CI: "true"
        run: npm ci

      # Exporte le chemin exact du Chromium de Puppeteer pour Lighthouse/chrome-launcher
      - name: Export Chrome path (Puppeteer)
        run: |
          echo "CHROME_PATH=$(node -p "require('puppeteer').executablePath()")" >> $GITHUB_ENV
          echo "GOOGLE_CHROME_BIN=$CHROME_PATH" >> $GITHUB_ENV
          echo "LIGHTHOUSE_CHROMIUM_PATH=$CHROME_PATH" >> $GITHUB_ENV
          echo "CI=true" >> $GITHUB_ENV
          
      - name: Git identity for CI
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Make script executable
        run: chmod +x scripts/run-publish.sh

      - name: Run publish script
        run: |
          cd scripts
          ./run-publish.sh
